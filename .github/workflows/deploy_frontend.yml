name: Deploy Flutter Web → Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'          # only triggers when frontend code changes
  workflow_dispatch:            # allow manual deploy

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Flutter setup ──────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ── 3. Get packages ───────────────────────────────────────────────────
      - name: Get Flutter packages
        working-directory: frontend
        run: flutter pub get

      # ── 4. Build web (inject API URL at build time) ───────────────────────
      - name: Build Flutter Web
        working-directory: frontend
        run: |
          flutter build web --release \
            --dart-define=API_URL=${{ secrets.RENDER_API_URL }} \
            --dart-define=WS_URL=${{ secrets.RENDER_WS_URL }}
        # RENDER_API_URL  = https://trading-dss-api.onrender.com
        # RENDER_WS_URL   = wss://trading-dss-api.onrender.com/ws/signals

      # ── 5. Deploy to Vercel ───────────────────────────────────────────────
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@master
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args:       '--prod --cwd build/web'
